[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evectio"
version = "1.5.0"
description = "Local AI-assisted quality control of DXA densitometry DICOM studies"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "joblib==1.6.0",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "Pillow==11.3.0",
  "pydicom==3.0.1",
  "python-multipart==0.0.20",
  "scikit-learn==1.7.2",
  "scipy==1.18.1",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
evectio = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["static/*.html", "static/*.png", "static/*.ico", "static/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
